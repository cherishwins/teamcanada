# The two checks that need the outside world, on their own clock.
#
# Deliberately NOT part of verify.yml. A publisher's outage, a rate limit, or
# a vendor moving an endpoint must never turn a PR red, and a deploy must
# never wait on somebody else's server. So these run weekly and on demand; a
# red run here means "something outside the repo moved, go look", never
# "cannot ship".
#
# Free: the repo is public, so Actions minutes are unmetered.
name: weekly

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays, 06:17 UTC — off the hour so it is not queued behind everyone else's
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every external link the built site cites still resolves.
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The checker reads the BUILT html, so the set of links it checks is
      # exactly the set a reader can click, generated pages included.
      - name: Build
        run: npm run build
      - name: Check every external link
        run: node tools/check-links.cjs

  # The Content-Security-Policy against the real vendors on the real site.
  # The sweep stubs every other origin, so it cannot see where a third-party
  # script actually connects — the first policy blocked Umami's beacons while
  # CI was green. The vendors' endpoints are theirs to move; this notices.
  csp-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Playwright stays out of package.json (see verify.yml); one install.
      - name: Install Playwright
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
      - name: Check the CSP on production
        run: node tools/check-csp-live.cjs https://northerntemper.ca

  # One URL per page, on the real edge. check-canonical proves the build asks
  # for the redirect; only production can prove the edge performs it, and the
  # host redirect for teamcanada.vercel.app cannot run anywhere else at all.
  # Plain fetch, no browser, no install.
  urls-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check canonical URLs and host redirects on production
        run: node tools/check-urls-live.cjs https://northerntemper.ca
