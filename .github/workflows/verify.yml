# Every check this repo relies on, run on every change.
#
# The repo is public, so Actions minutes are free and unmetered — this costs
# nothing, which is the only reason it is allowed to exist here.
#
# It exists because the same failure has now happened twice: a convention was
# written down in CLAUDE.md, the script enforcing it lived in a scratch
# directory, the session ended, and the rule quietly stopped being true. The
# French typography pass was reinstated only after /fr had shipped with 71
# straight apostrophes. Committing the scripts fixed half of that. This fixes
# the other half — nobody has to remember to run them.
name: verify

on:
  pull_request:
  push:
    branches: [main]
  # The record workflow dispatches this after it commits a new snapshot to
  # main. A push made with GITHUB_TOKEN does not trigger `push` workflows (GitHub
  # forbids workflows chaining off their own token), so without this the sweep
  # would never see a bot commit.
  workflow_dispatch:

# A new push supersedes the run in flight; no point verifying a stale commit.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Playwright and @astrojs/check are intentionally absent from
      # package.json: Vercel installs devDependencies to build, and neither a
      # browser-automation library nor a language server belongs in the install
      # path of a static site that never uses them at runtime.
      #
      # ONE STEP, ON PURPOSE. `npm i --no-save X` reconciles node_modules to
      # package.json plus X, which PRUNES anything else installed un-saved. A
      # second `--no-save` install in a later step deleted Playwright and the
      # sweep failed with "playwright not found". Install them together, once.
      - name: Install CI-only tools
        run: |
          npm i --no-save playwright @astrojs/check typescript html-validate
          npx playwright install --with-deps chromium

      # `npm run build` also runs check-french, check-llms, check-privacy and
      # check-docs — any one of them fails the build — and generates
      # llms-full.txt.
      - name: Build
        run: npm run build

      # `astro check` is TypeScript + Astro diagnostics. @astrojs/check pulls a
      # Volar language server, Emmet, Prettier and the VS Code language
      # services — 75 packages of editor toolchain — so it follows the
      # Playwright rule above. The script sat in package.json for months with
      # its dependency missing, so it could not run at all; it runs here now,
      # and the first thing it found was a StatCan fetch on /fr whose result
      # was discarded.
      #
      # `npx astro check`, NOT `npm run check`: the package.json script
      # self-installs its dependencies for convenience on a developer's
      # machine, and that install would prune Playwright here. CI installed
      # them above, so it runs the binary directly.
      - name: Type-check
        run: npx astro check

      # Valid HTML, by the spec rather than by "the browser coped". The Astro
      # compiler refuses unbalanced tags but says nothing about a <th> without
      # scope, a title that will be cut off in a tab, or a phone number that
      # can wrap. The first run found twelve of the first kind in one table.
      # Config in .htmlvalidate.json; no-inline-style is off there because the
      # stylesheet is inlined by design and a few layout nudges are attributes.
      - name: Validate HTML
        run: npx html-validate '.vercel/output/static/**/*.html'

      - name: Audit dependencies
        run: npm audit --audit-level=high

      # Every page x 10 viewports: overflow, console errors, tap targets,
      # contrast, pages served, broken references, og:image:alt, the service
      # worker, axe-core and CSP violations. Exits non-zero on any of the ten.
      - name: Sweep
        run: node tools/verify.cjs

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .vercel/output/static
          retention-days: 3

  # The same build with every upstream down. Pages are prerendered from StatCan,
  # the Bank of Canada, the World Bank and ECCC, and a figure never renders
  # blank: each falls back and says so. That has to hold for the BUILD as well,
  # and so does everything a page ships. /calculator once carried the live
  # population inside an inline script whose sha256 vercel.json pins, so every
  # deploy after StatCan published a new quarter, or timed out mid-build, would
  # have failed check-csp; nothing noticed, because CI only ever built with the
  # network up. NT_OFFLINE=1 (src/lib/sources.ts) fails every upstream at once,
  # so a shipped byte that depends on the data fails HERE, on the PR.
  offline-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build with every upstream down
        run: npm run build
        env:
          NT_OFFLINE: '1'
